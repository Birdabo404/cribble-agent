      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="60" y="50" width="860" height="316" rx="10" fill="#171717" stroke="#343a32" filter="url(#shadow)"/>
  <circle cx="74" cy="63" r="5.5" fill="#ff5a54"/>
  <circle cx="93" cy="63" r="5.5" fill="#e6bf29"/>
  <circle cx="112" cy="63" r="5.5" fill="#52c12b"/>
