<svg xmlns="http://www.w3.org/2000/svg" width="980" height="438" viewBox="0 0 980 438" role="img" aria-labelledby="title description">
  <title id="title">Cribble Agent terminal token-usage report</title>
  <desc id="description">A fictional example of the Cribble token tracker report.</desc>
